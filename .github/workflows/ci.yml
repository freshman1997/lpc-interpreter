name: CI

on:
  push:
  pull_request:

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload secret scan artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            .cache/gitleaks-report.json

  build-and-check:
    name: Build and Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run compiler frontend tests
        shell: pwsh
        run: |
          $exe = if ($IsWindows) { '.exe' } else { '' }
          & "./build/compiler/lpc_compiler$exe" --test

      - name: Run VM self-check
        shell: pwsh
        run: |
          $exe = if ($IsWindows) { '.exe' } else { '' }
          & "./build/vm/lpc_vm$exe" --self-check

      - name: Run LPC regression suite
        shell: pwsh
        run: ./run_lpc_tests.ps1 -Root $PWD

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-${{ matrix.os }}-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            log/**
            .cache/**
